name: Latihan

on: 
    push: 
        
    workflow_dispatch: 

    schedule:
        - cron: '0 0 * * *'
          timezone: 'Asia/Jakarta'

jobs:
    test-build:
        runs-on: ubuntu-latest
        container:
          image: node:lts-alpine
        steps:
            - name: Check Out
              uses: actions/checkout@master
            
            - name: Setup and build
              run: |
                corepack enable
                pnpm install --frozen-lockfile
                pnpm run build
