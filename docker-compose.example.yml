services:
  php:
    image: fm-php
    build:
      context: .
      target: fm-php
    environment:
      - DB_HOST=mariadb
      - DB_NAME=facility_db
      - DB_USER=facility_manager
      - DB_PASS=facility_db_pass
    # volumes: # fallback env
    #   - ./.env:/var/www/html/.env:Z
    depends_on:
      - mariadb
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: super_secret_root_password
      MARIADB_DATABASE: facility_db
      MARIADB_USER: facility_manager
      MARIADB_PASSWORD: facility_db_pass
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db-schema:/docker-entrypoint-initdb.d:Z
  nginx:
    image: fm-nginx
    build:
      context: .
      target: fm-nginx
    ports:
      - 8180:80
    depends_on:
      - php
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:Z

volumes:
  mariadb_data:
